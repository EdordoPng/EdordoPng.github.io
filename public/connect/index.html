<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect | Edoardo Diana</title>
  <meta name="description" content="Digital contact card and links for Edoardo Diana - AI &amp; Cybersecurity Engineer, Web3 Builder." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Shared Background infrastructure -->
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Main Connect View -->
  <div id="main-view" class="page-shell">
    
    <!-- 1. Profile / Identity Section -->
    <header class="identity-section">
      <div class="profile-avatar-frame">
        <img 
          src="/profile.jpg" 
          alt="Edoardo Diana" 
          class="profile-avatar"
          width="82"
          height="82"
          loading="eager"
        />
      </div>
      <div class="identity-text">
        <h1 class="profile-name">Edoardo Diana</h1>
        <p class="profile-role-primary">AI &amp; Cybersecurity Engineer</p>
        <p class="profile-role-secondary">Web3 Builder</p>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- 2. Primary and Secondary CTAs -->
      <section class="cta-group" aria-label="Primary Actions">
        <!-- Primary CTA: Connect on LinkedIn -->
        <a 
          href="https://linkedin.com/in/edoardo-diana" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn btn-primary"
          aria-label="Connect on LinkedIn"
        >
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect width="4" height="12" x="2" y="9"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          <span>Connect on LinkedIn</span>
        </a>

      </section>

      <!-- 3. Professional Links Grouped Card -->
      <section aria-label="Professional Links">
        <div class="grouped-links-card">
          <ul class="grouped-links-list">
            
            <!-- Link 1: GitHub Profile -->
            <li class="grouped-link-item">
              <a 
                href="https://github.com/EdordoPng" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="grouped-link-row"
                aria-label="GitHub profile @EdordoPng"
              >
                <div class="link-info">
                  <svg class="link-icon-start" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
                    <path d="M9 18c-4.51 2-5-2-7-2"/>
                  </svg>
                  <span class="link-label">GitHub</span>
                </div>
                <div class="link-end">
                  <span class="link-meta">@EdordoPng</span>
                  <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </div>
              </a>
            </li>

            <!-- Link 2: Portfolio Projects -->
            <li class="grouped-link-item">
              <a 
                href="/projects" 
                class="grouped-link-row"
                aria-label="Portfolio Projects"
              >
                <div class="link-info">
                  <svg class="link-icon-start" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L8.6 3.3A2 2 0 0 0 6.9 2.5H4a2 2 0 0 0-2 2v13.5a2 2 0 0 0 2 2z"/>
                  </svg>
                  <span class="link-label">Projects</span>
                </div>
                <div class="link-end">
                  <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </div>
              </a>
            </li>

            <!-- Link 3: CV Version Selector Trigger Button -->
            <li class="grouped-link-item">
              <button 
                type="button" 
                id="cv-open-btn" 
                class="grouped-link-row grouped-link-button"
                aria-label="Choose CV version"
              >
                <div class="link-info">
                  <svg class="link-icon-start" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" x2="8" y1="13" y2="13"/>
                    <line x1="16" x2="8" y1="17" y2="17"/>
                  </svg>
                  <span class="link-label">CV</span>
                </div>
                <div class="link-end">
                  <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </div>
              </button>
            </li>

            <!-- Link 4: WhatsApp Direct Link -->
            <li class="grouped-link-item">
              <a 
                href="https://wa.me/pomododo" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="grouped-link-row"
                aria-label="WhatsApp @pomododo"
              >
                <div class="link-info">
                  <svg class="link-icon-start" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>
                  </svg>
                  <span class="link-label">WhatsApp</span>
                </div>
                <div class="link-end">
                  <span class="link-meta">@pomododo</span>
                  <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </div>
              </a>
            </li>

          </ul>
        </div>
      </section>

      <!-- 4. Show QR Action Button -->
      <section class="utility-section" aria-label="QR Code Utility">
        <button 
          id="qr-open-btn" 
          class="btn btn-qr-toggle" 
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="qr-modal"
          aria-label="Show QR code for offline sharing"
        >
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="5" height="5" x="3" y="3" rx="1"/>
            <rect width="5" height="5" x="16" y="3" rx="1"/>
            <rect width="5" height="5" x="3" y="16" rx="1"/>
            <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
            <path d="M21 21v.01"/>
            <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
            <path d="M3 12h.01"/>
            <path d="M12 3h.01"/>
            <path d="M12 16v.01"/>
            <path d="M16 12h1"/>
            <path d="M21 12v.01"/>
            <path d="M12 21v-1"/>
          </svg>
          <span class="btn-text">Show QR</span>
          <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </section>

    </main>
  </div>

  <!-- Dedicated CV Selection Screen (Internal Navigational Subview) -->
  <div id="cv-view" class="cv-view" hidden>
    <div class="cv-view-shell">
      
      <!-- Top: Horizontally Centered CV Title -->
      <h1 id="cv-view-title" class="cv-title">CV</h1>

      <!-- Middle: Vertically Centered Download Card -->
      <div class="cv-download-region">
        <div class="grouped-links-card cv-download-card">
          <ul class="grouped-links-list">
            
            <!-- CV 1: Blockchain -->
            <li class="grouped-link-item">
              <a 
                href="./assets/cv/Edoardo_Diana_BlockchainWeb3Developer_2026.pdf" 
                download="Edoardo_Diana_BlockchainWeb3Developer_2026.pdf" 
                class="grouped-link-row"
                aria-label="Download Blockchain CV"
              >
                <span class="link-label">Blockchain</span>
                <div class="link-end">
                  <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </div>
              </a>
            </li>

            <!-- CV 2: AI -->
            <li class="grouped-link-item">
              <a 
                href="./assets/cv/Edoardo_Diana_AIEngineer_2026.pdf" 
                download="Edoardo_Diana_AIEngineer_2026.pdf" 
                class="grouped-link-row"
                aria-label="Download AI CV"
              >
                <span class="link-label">AI</span>
                <div class="link-end">
                  <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </div>
              </a>
            </li>

            <!-- CV 3: Cybersecurity -->
            <li class="grouped-link-item">
              <a 
                href="./assets/cv/Edoardo_Diana_CybersecurityEngineer_2026.pdf" 
                download="Edoardo_Diana_CybersecurityEngineer_2026.pdf" 
                class="grouped-link-row"
                aria-label="Download Cybersecurity CV"
              >
                <span class="link-label">Cybersecurity</span>
                <div class="link-end">
                  <svg class="link-icon-end" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </div>
              </a>
            </li>

          </ul>
        </div>
      </div>

      <!-- Bottom: Full-Width Oxblood Back Button CTA with Left Arrow -->
      <div class="cv-footer-region">
        <button 
          type="button" 
          id="cv-back-btn" 
          class="btn btn-cv-back" 
          aria-label="Back to Connect"
        >
          <svg class="btn-icon-start" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Fullscreen QR Code Overlay Modal -->
  <div 
    id="qr-modal" 
    class="qr-modal" 
    role="dialog" 
    aria-modal="true" 
    aria-labelledby="qr-modal-title" 
    hidden
  >
    <div class="qr-modal-backdrop" id="qr-modal-backdrop"></div>
    <div class="qr-modal-content">
      <button 
        type="button" 
        id="qr-close-btn" 
        class="qr-close-btn" 
        aria-label="Close QR presentation"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <h2 id="qr-modal-title" class="qr-modal-title">Scan to connect</h2>

      <div class="qr-code-frame" aria-label="QR Code for edordopng.github.io/qr/">
        <img
          src="/assets/qr.svg"
          alt="QR code for edordopng.github.io/qr/"
          class="qr-code-img"
          width="220"
          height="220"
          loading="eager"
        />
      </div>

      <p class="qr-modal-subtitle">edordopng.github.io/qr/</p>
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
